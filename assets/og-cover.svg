<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Open Graph cover Pitza</title>
  <desc id="desc">Copertina social con headline Pitza e palette rosso verde.</desc>
  <defs>
    <linearGradient id="cover" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#18362e"/>
      <stop offset="100%" stop-color="#a92d2a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#cover)"/>
  <circle cx="930" cy="300" r="170" fill="#f1c27c"/>
  <circle cx="930" cy="300" r="130" fill="#e8b35f"/>
  <g fill="#fffdf9" font-family="Georgia, serif">
    <text x="92" y="220" font-size="38" letter-spacing="8">PITZA</text>
    <text x="92" y="320" font-size="82" font-weight="700">Pizza Napoletana</text>
    <text x="92" y="402" font-size="82" font-weight="700">per Eventi</text>
    <text x="92" y="478" font-size="30">Matrimoni, corporate e feste private con forno mobile e live cooking.</text>
  </g>
</svg>
